name: Update simulation data
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python update_demo.py
      - name: Commit changed data
        run: |
          git config user.name 'dashboard-demo-bot'
          git config user.email 'dashboard-demo-bot@users.noreply.github.com'
          git add data
          if ! git diff --cached --quiet; then
            git commit -m 'Update simulation data'
            git push
          fi
